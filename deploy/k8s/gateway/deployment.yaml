apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: marketplace/gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: USERS_API_URL
              value: http://users:8082
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://keycloak:8080/realms/marketplace
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
