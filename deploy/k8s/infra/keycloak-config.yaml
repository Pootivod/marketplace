apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
data:
  marketplace-realm.yaml: |
    realm: marketplace
    enabled: true
    roles:
      realm:
        - name: admin
        - name: user
        - name: worker-support
        - name: worker-pudo # ПВЗ
        - name: worker-courier
    clients:
      - clientId: admin-cli
        publicClient: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: true
