apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: {{ $.Values.namespace.name }}
data:
  marketplace-realm.json: |
    {
      "realm": "marketplace",
      "enabled": true,
      "roles": {
        "realm": [
          {
            "name": "admin"
          },
          {
            "name": "user"
          },
          {
            "name": "worker-support"
          },
          {
            "name": "worker-pudo"
          },
          {
            "name": "worker-courier"
          }
        ]
      },
      "clients": [
        {
          "clientId": "admin-cli",
          "publicClient": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true
        }
      ]
    }
