apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-read-role
  namespace: {{ .Values.namespace.name }}
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-read-binding
  namespace: {{ .Values.namespace.name }}
subjects:
  - kind: ServiceAccount
    name: default
roleRef:
  kind: Role
  name: gateway-read-role
  apiGroup: rbac.authorization.k8s.io
---
{{ include "marketplace.service" (dict
  "root" .
  "name" "gateway"
) }}
---
{{ include "marketplace.deployment" (dict
  "root" .
  "name" "gateway"
  "replicas" 1
  "image" (include "marketplace.image" (dict "root" . "name" "gateway" "tag" .Values.image.tag))
  "envFrom" (list
    (dict "configMapRef" (dict "name" "global-config"))
  )
  "livenessProbe" (dict
    "httpGet" (dict "path" "/actuator/health/liveness" "port" 9000)
    "initialDelaySeconds" 40
    "periodSeconds" 10
  )
  "readinessProbe" (dict
    "httpGet" (dict "path" "/actuator/health/readiness" "port" 9000)
    "initialDelaySeconds" 5
    "periodSeconds" 10
  )
) }}
