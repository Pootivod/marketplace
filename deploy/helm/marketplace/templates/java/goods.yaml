{{ include "marketplace.service" (dict
  "root" .
  "name" "goods"
  "labels" (dict "exposed" "true")
) }}
---
{{ include "marketplace.deployment" (dict
  "root" .
  "name" "goods"
  "replicas" 2
  "image" (include "marketplace.image" (dict "root" . "name" "goods" "tag" .Values.image.tag))
  "envFrom" (list
    (dict "secretRef" (dict "name" "marketplace-secrets"))
    (dict "configMapRef" (dict "name" "global-config"))
  )
) }}
