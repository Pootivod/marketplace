{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.rbac $svc.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-read-role
  namespace: {{ $.Values.global.namespace.name }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-read-binding
  namespace: {{ $.Values.global.namespace.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $svc.serviceAccount.name | default $name }}
roleRef:
  kind: Role
  name: {{ $name }}-read-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
