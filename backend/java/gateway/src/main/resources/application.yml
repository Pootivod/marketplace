server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            service-labels:
              exposed: "true"
            locator:
              enabled: true
              lower-case-service-id: true
              predicates:
                - Path='/'+serviceId+'/api/**'
          default-filters:
            - TokenRelay=
            - StripPrefix=1

# Override include. Others on common.starter
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
