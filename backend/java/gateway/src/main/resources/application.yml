app:
  common-starter:
    security:
      enabled: false
server:
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            service-labels:
              exposed: "true"
            locator:
              enabled: true
              lower-case-service-id: true
              predicates:
                - Path='/'+serviceId+'/api/**'
          default-filters:
            - TokenRelay=

# Override include. Others on common.starter
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway