server:
  port: 8080

spring:
  application:
    name: gateway-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/marketplace}
  cloud:
    gateway:
      routes:
        - id: users-api
          uri: ${USERS_API_URL:http://users-api:8082}
          predicates:
            - Path=/api/v1/users/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
