server:
  port: 8082

spring:
  application:
    name: users-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-users:5432/marketplace_users}
    username: ${SPRING_DATASOURCE_USERNAME:marketplace}
    password: ${SPRING_DATASOURCE_PASSWORD:marketplace}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/marketplace}

management:
  endpoints:
    web:
      exposure:
        include: health,info
